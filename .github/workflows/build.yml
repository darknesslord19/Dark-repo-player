name: APK derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: APK derle
        run: gradle :app:assembleRelease --stacktrace

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/release/app-release.apk StreamBox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StreamBox-apk
          path: StreamBox.apk

      # Telefondan kolay indirmek için: Releases > "latest" altında StreamBox.apk
      - name: Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: StreamBox (son derleme)
          prerelease: true
          files: StreamBox.apk
          body: "Derleme #${{ github.run_number }} — ${{ github.sha }}"
