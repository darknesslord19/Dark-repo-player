name: APK derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: APK derle
        run: gradle :app:assembleFullRelease :app:assembleSitesRelease --stacktrace

      - name: CloudStream uyumluluk kontrolü (imza karşılaştırma)
        continue-on-error: true
        run: |
          curl -sSL -o cs.jar https://github.com/recloudstream/cloudstream/releases/download/pre-release/classes.jar
          OUR=app/build/tmp/kotlin-classes/fullRelease
          for c in CloudStreamApp 'CloudStreamApp$Companion' 'AcraApplication$Companion' CommonActivity utils.DataStore utils.Editor \
                   network.CloudflareKiller network.DdosGuardKiller network.RequestsHelperKt network.DohProvidersKt plugins.Plugin; do
            n="com.lagradost.cloudstream3.$c"
            javap -classpath cs.jar "$n" | grep -E '^\s+public' | grep -v 'access\$\|\$stable\|annotations\|static {}' | sed 's/ throws .*;/;/' | sort > real.txt
            javap -classpath "$OUR" "$n" 2>/dev/null | grep -E '^\s+public' | sed 's/ throws .*;/;/' | sort > ours.txt
            missing=$(comm -23 real.txt ours.txt)
            if [ -n "$missing" ]; then echo "### $c — eksik:"; echo "$missing"; else echo "### $c — tamam"; fi
          done

      - name: APK'yı yeniden adlandır
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk DarknesBox.apk
          cp app/build/outputs/apk/sites/release/app-sites-release.apk DarknesSiteler.apk
          # eski bağlantı çalışmaya devam etsin
          cp DarknesBox.apk StreamBox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DarknesBox-apk
          path: DarknesBox.apk

      # Telefondan kolay indirmek için: Releases > "latest" altında DarknesBox.apk
      - name: Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DarknesBox (son derleme)
          prerelease: true
          files: |
            DarknesBox.apk
            StreamBox.apk
            DarknesSiteler.apk
          body: "Derleme #${{ github.run_number }} — ${{ github.sha }}"
