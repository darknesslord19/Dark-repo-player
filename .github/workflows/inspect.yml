name: CloudStream sınıf incelemesi

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: İndir
        run: |
          curl -sSL -o app.jar https://github.com/recloudstream/cloudstream/releases/download/pre-release/classes.jar
          curl -sSL -o lib.jar https://jitpack.io/com/github/recloudstream/cloudstream/library-jvm/v4.8.0/library-jvm-v4.8.0.jar || true
          ls -la app.jar lib.jar
      - name: İnceleme 3
        run: |
          echo "== lib MainActivityKt / WebViewResolver"; unzip -Z1 lib.jar | grep -iE 'MainActivityKt|WebViewResolver|network/' | head -40
          echo "== app WebViewResolver"; unzip -Z1 app.jar | grep -i 'WebViewResolver' | head
          javap -classpath app.jar com.lagradost.cloudstream3.network.WebViewResolver || true
          javap -classpath app.jar 'com.lagradost.cloudstream3.network.WebViewResolver$Companion' || true
          javap -classpath lib.jar com.lagradost.cloudstream3.network.WebViewResolver || true
          javap -classpath lib.jar com.lagradost.cloudstream3.MainActivityKt || true
